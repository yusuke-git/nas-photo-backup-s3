# Raspberry Pi 4 向けの Immich 構成。
# 公式の docker-compose.yml（https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml）を元に、
# 次の点だけ変えている。差分は docs/setup-immich.md の「公式構成との違い」を参照。
#   - NAS の写真（/mnt/nas/photos）を外部ライブラリとして読み取り専用でマウント
#   - サムネイル（/data/thumbs）を NAS の Thumbnail 共有に置く
#   - 機械学習コンテナは profile "ml" に入れ、既定では起動しない
#   - サーバー設定を immich-config.json で管理する（Git に残すため）
# Immich を更新するときは、新しいリリースの公式ファイルと見比べてから反映すること。

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Immich が作る動画変換・DB の自動バックアップなどの置き場所（ラズパイのローカルディスク）
      - ${UPLOAD_LOCATION}:/data
      # サムネイルだけ NAS の Thumbnail 共有（読み書きでマウント済み）に置く
      - ${THUMB_LOCATION}:/data/thumbs
      # NAS の元写真。末尾の :ro は read-only（読み取り専用）で、Immich から削除・書き込みはできない
      - ${PHOTOS_LOCATION}:/mnt/media/photos:ro
      - ./immich-config.json:/config/immich-config.json:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      IMMICH_CONFIG_FILE: /config/immich-config.json
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # Pi4 では重いため既定では起動しない。使う場合は docs/setup-immich.md の「機械学習を有効にする」を参照
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    profiles: ['ml']
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE:-SSD}
    volumes:
      # ネットワーク共有（NAS）には置かないこと。ラズパイのローカルディスク専用
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
